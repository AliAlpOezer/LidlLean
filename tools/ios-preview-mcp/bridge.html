<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LidlLean iOS Preview Bridge</title>
  <style>html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }</style>
</head>
<body>
  <iframe id="appetize" title="Appetize iOS simulator"></iframe>
  <script>
    (() => {
      let client;
      let session;

      function assertSession() {
        if (!session) throw new Error("No active iOS preview session. Call ios_preview_start first.");
        return session;
      }

      async function loadSdk() {
        if (window.appetize?.getClient) return;
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://js.appetize.io/embed.js";
          script.async = true;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Could not load the Appetize browser SDK."));
          document.head.appendChild(script);
        });
      }

      function publicDeviceInfo() {
        return {
          buildId: session?.config?.buildId,
          device: session?.device?.device || session?.config?.device,
          osVersion: session?.device?.osVersion || session?.config?.osVersion
        };
      }

      window.LidlLeanPreviewBridge = {
        async start(configuration) {
          await this.end();
          await loadSdk();
          client = await window.appetize.getClient("#appetize", {
            buildId: configuration.buildId,
            device: configuration.device,
            osVersion: configuration.osVersion,
            appearance: configuration.appearance,
            record: true,
            screenOnly: true,
            codec: "jpeg"
          });
          session = await client.startSession();
          await session.waitUntilReady();
          return publicDeviceInfo();
        },

        async screenshot() {
          const active = assertSession();
          const capture = await active.screenshot("base64");
          return { data: capture.data, mimeType: capture.mimeType || "image/png" };
        },

        async uiTree() {
          return await assertSession().getUI();
        },

        async tap(target) {
          const active = assertSession();
          await active.tap(target);
          await active.waitForAnimations({ timeout: 5000 });
          return publicDeviceInfo();
        },

        async swipe(gesture) {
          const active = assertSession();
          await active.swipe({ position: { x: "50%", y: "50%" }, gesture });
          await active.waitForAnimations({ timeout: 5000 });
          return publicDeviceInfo();
        },

        async type(text) {
          const active = assertSession();
          await active.type(text);
          await active.waitForAnimations({ timeout: 5000 });
          return publicDeviceInfo();
        },

        async restart() {
          const active = assertSession();
          await active.restartApp();
          await active.waitUntilReady();
          return publicDeviceInfo();
        },

        async end() {
          if (session) {
            try { await session.end(); } catch (_) { /* Session may already be closed. */ }
          }
          session = undefined;
          client = undefined;
          return { ended: true };
        }
      };
    })();
  </script>
</body>
</html>
