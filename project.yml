name: LidlLean
options:
  bundleIdPrefix: com.alial
  deploymentTarget:
    iOS: '17.0'
targets:
  LidlLean:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alial.lidllean
        PRODUCT_NAME: LidlLean
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
    entitlements:
      path: App/LidlLean.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LidlLean
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        NSCameraUsageDescription: LidlLean uses the camera to scan food barcodes.
        NSHealthShareUsageDescription: LidlLean reads the Apple Health activity you select to put your food log in context.
        NSHealthUpdateUsageDescription: LidlLean does not write Health data in this version.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.alial.lidllean.health-sync
            CFBundleURLSchemes: [lidllean]
    scheme:
      testTargets: [LidlLeanUITests]
  LidlLeanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LidlLean
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
