name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify nutrition values and existing journals
        run: |
          xcrun swiftc Core/Nutrients.swift Core/OpenFoodFactsClient.swift Tests/Nutrients/main.swift -o "$RUNNER_TEMP/nutrient-tests"
          "$RUNNER_TEMP/nutrient-tests"
          git show 1f5cd6d4d44bf65c1efec15bc090271977c1f8ba:Core/Models.swift > "$RUNNER_TEMP/LegacyModels.swift"
          xcrun swiftc -target "$(uname -m)-apple-macosx14.0" -module-name LidlLean "$RUNNER_TEMP/LegacyModels.swift" Tests/PersistenceSeed/main.swift -o "$RUNNER_TEMP/seed-store"
          "$RUNNER_TEMP/seed-store" "$RUNNER_TEMP/migration.store"
          xcrun swiftc -target "$(uname -m)-apple-macosx14.0" -module-name LidlLean Core/Nutrients.swift Core/Models.swift Tests/Persistence/main.swift -o "$RUNNER_TEMP/check-store"
          "$RUNNER_TEMP/check-store" "$RUNNER_TEMP/migration.store"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify and render iPhone 11 user journeys
        run: |
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c 'import sys,json; r=json.load(sys.stdin)["runtimes"]; print([x["identifier"] for x in r if x["platform"] == "iOS"][-1])')
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import sys,json; d=json.load(sys.stdin)["devicetypes"]; print(next(x["identifier"] for x in d if x["name"] == "iPhone 11"))')
          DEVICE_ID=$(xcrun simctl create LidlLean-iPhone-11 "$DEVICE_TYPE" "$RUNTIME")
          trap 'xcrun simctl delete "$DEVICE_ID"' EXIT
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          set +e
          xcodebuild test -project LidlLean.xcodeproj -scheme LidlLean -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath build/PlanningUITests.xcresult CODE_SIGNING_ALLOWED=NO
          TEST_STATUS=$?
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Debug-iphonesimulator/LidlLean.app' -type d -print -quit)
          plutil -p "$APP_PATH/Info.plist"
          plutil -extract UILaunchStoryboardName raw "$APP_PATH/Info.plist"
          plutil -extract UIRequiresFullScreen raw "$APP_PATH/Info.plist"
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/PlanningUITests.xcresult --output-path build/screenshots
          exit $TEST_STATUS
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-screenshots
          path: build/screenshots
          retention-days: 7
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-ui-test-results
          path: build/PlanningUITests.xcresult
          retention-days: 7
      - name: Verify HealthKit capability wiring
        run: |
          python3 -c 'import plistlib; assert plistlib.load(open("App/LidlLean.entitlements", "rb"))["com.apple.developer.healthkit"] is True'
          xcodebuild -project LidlLean.xcodeproj -scheme LidlLean -showBuildSettings | grep -q 'CODE_SIGN_ENTITLEMENTS = App/LidlLean.entitlements'
      - name: Verify weekly planning scenarios
        run: |
          xcrun swiftc Core/WeeklyPlanner.swift Core/Momentum.swift Tests/Planner/main.swift -o "$RUNNER_TEMP/planner-tests"
          "$RUNNER_TEMP/planner-tests"
      - name: Verify private AI prompt scenarios
        run: |
          xcrun swiftc Core/AICoachClient.swift Tests/AICoach/main.swift -o "$RUNNER_TEMP/ai-coach-tests"
          "$RUNNER_TEMP/ai-coach-tests"
      - name: Verify live Lidl catalog ingestion
        run: |
          xcrun swiftc Core/LidlCatalogClient.swift Tests/LidlCatalog/main.swift -o "$RUNNER_TEMP/lidl-catalog-tests"
          "$RUNNER_TEMP/lidl-catalog-tests"
      - name: Archive unsigned device app
        run: >-
          xcodebuild archive
          -project LidlLean.xcodeproj
          -scheme LidlLean
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -archivePath "$PWD/build/LidlLean.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/LidlLean.xcarchive/Products/Applications/LidlLean.app build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/LidlLean-unsigned.ipa
      - name: Verify IPA payload
        run: |
          unzip -l build/LidlLean-unsigned.ipa | grep -q 'Payload/LidlLean.app/LidlLean$'
          plutil -lint build/LidlLean.xcarchive/Products/Applications/LidlLean.app/Info.plist
          python3 tools/healthkit-signer/check_app_metadata.py build/LidlLean-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LidlLean-unsigned-ipa
          path: build/LidlLean-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
