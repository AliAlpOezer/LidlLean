name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/ios-preview-mcp/package-lock.json
      - name: Verify iOS preview MCP
        run: |
          npm ci --prefix tools/ios-preview-mcp
          npm test --prefix tools/ios-preview-mcp
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify HealthKit capability wiring
        run: |
          python3 -c 'import plistlib; assert plistlib.load(open("App/LidlLean.entitlements", "rb"))["com.apple.developer.healthkit"] is True'
          xcodebuild -project LidlLean.xcodeproj -scheme LidlLean -showBuildSettings | grep -q 'CODE_SIGN_ENTITLEMENTS = App/LidlLean.entitlements'
      - name: Verify weekly planning scenarios
        run: |
          xcrun swiftc Core/WeeklyPlanner.swift Tests/Planner/main.swift -o "$RUNNER_TEMP/planner-tests"
          "$RUNNER_TEMP/planner-tests"
      - name: Verify private AI prompt scenarios
        run: |
          xcrun swiftc Core/AICoachClient.swift Tests/AICoach/main.swift -o "$RUNNER_TEMP/ai-coach-tests"
          "$RUNNER_TEMP/ai-coach-tests"
      - name: Verify live Lidl catalog ingestion
        run: |
          xcrun swiftc Core/LidlCatalogClient.swift Tests/LidlCatalog/main.swift -o "$RUNNER_TEMP/lidl-catalog-tests"
          "$RUNNER_TEMP/lidl-catalog-tests"
      - name: Test goal setup on an iPhone simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c 'import sys,json; r=json.load(sys.stdin)["runtimes"]; print([x["identifier"] for x in r if x["platform"] == "iOS"][-1])')
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import sys,json; d=json.load(sys.stdin)["devicetypes"]; print(next(x["identifier"] for x in d if x["name"] == "iPhone 11"))')
          DEVICE_ID=$(xcrun simctl create LidlLean-iPhone-11 "$DEVICE_TYPE" "$RUNTIME")
          trap 'xcrun simctl delete "$DEVICE_ID"' EXIT
          xcodebuild test -project LidlLean.xcodeproj -scheme LidlLean -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath build/PlanningUITests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Upload simulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-ui-test-results
          path: build/PlanningUITests.xcresult
          retention-days: 7
      - name: Build Appetize simulator preview
        run: |
          xcodebuild build \
            -project LidlLean.xcodeproj \
            -scheme LidlLean \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build/SimulatorDerivedData" \
            CODE_SIGNING_ALLOWED=NO
          APP_PATH="$PWD/build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/LidlLean.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/LidlLean-simulator-app.zip
          unzip -l build/LidlLean-simulator-app.zip | grep -q 'LidlLean.app/Info.plist'
      - name: Upload Appetize simulator preview
        uses: actions/upload-artifact@v4
        with:
          name: LidlLean-simulator-app
          path: build/LidlLean-simulator-app.zip
          if-no-files-found: error
          retention-days: 7
      - name: Archive unsigned device app
        run: >-
          xcodebuild archive
          -project LidlLean.xcodeproj
          -scheme LidlLean
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -archivePath "$PWD/build/LidlLean.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/LidlLean.xcarchive/Products/Applications/LidlLean.app build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/LidlLean-unsigned.ipa
      - name: Verify IPA payload
        run: |
          unzip -l build/LidlLean-unsigned.ipa | grep -q 'Payload/LidlLean.app/LidlLean$'
          plutil -lint build/LidlLean.xcarchive/Products/Applications/LidlLean.app/Info.plist
      - uses: actions/upload-artifact@v4
        with:
          name: LidlLean-unsigned-ipa
          path: build/LidlLean-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
